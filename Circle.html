<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Custom Cursor with Tailwind</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    /* Hide default cursor */
    html, body {
      cursor: none;
    }

    /* Custom circle cursor */
    #custom-cursor {
      position: fixed;
      top: 0;
      left: 0;
      width: 30px;
      height: 30px;
      border-radius: 50%;
      background: radial-gradient(circle at center, #FF1B6B, #45CAFF);
      pointer-events: none;
      mix-blend-mode: difference;
      z-index: 9999;
      transform: translate(-50%, -50%);
      transition: transform 0.04s linear;
    }
  </style>
</head>
<body class="bg-black text-white relative">

  <!-- Circle Cursor -->
  <div id="custom-cursor"></div>

  <!-- Navbar -->
  <nav class="w-full fixed top-0 left-0 bg-white/10 backdrop-blur-md border-b border-white/20 z-50">
    <div class="max-w-7xl mx-auto px-6 py-4 flex justify-between items-center">
      <div class="text-xl font-bold text-white">MySite</div>
      <div class="space-x-6">
        <a href="#home" class="text-white hover:text-[#FF1B6B] transition">Home</a>
        <a href="#about" class="text-white hover:text-[#FF1B6B] transition">About</a>
        <a href="#services" class="text-white hover:text-[#FF1B6B] transition">Services</a>
        <a href="#contact" class="text-white hover:text-[#FF1B6B] transition">Contact</a>
      </div>
    </div>
  </nav>

  <!-- Sections -->
  <section id="home" class="h-screen flex items-center justify-center">
    <h1 class="text-5xl font-bold">Welcome to Home</h1>
  </section>
  <section id="about" class="h-screen flex items-center justify-center bg-[#111]">
    <h1 class="text-5xl font-bold">About Us</h1>
  </section>
  <section id="services" class="h-screen flex items-center justify-center bg-[#222]">
    <h1 class="text-5xl font-bold">Our Services</h1>
  </section>
  <section id="contact" class="h-screen flex items-center justify-center bg-[#333]">
    <h1 class="text-5xl font-bold">Contact Us</h1>
  </section>

  <!-- JS: Cursor Movement -->
  <script>
    const cursor = document.getElementById('custom-cursor');
    document.addEventListener('mousemove', (e) => {
      cursor.style.transform = `translate(${e.clientX}px, ${e.clientY}px)`;
    });
  </script>

</body>
</html>
